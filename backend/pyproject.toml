# noomo - a llm predictions game
# Copyright (C) 2026  skueee

[project]
name = "noomo-backend"
version = "0.1.0"
description = "The backend for Noomo, a game about predicting what an LLM could say."
readme = "README.md"
authors = [
    { name = "skueee", email = "skueee@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "fastapi[standard]>=0.141.1",
    "regex>=2026.9.3",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[project.scripts]
download = "noomo_backend:download"

[tool.uvs.scripts]
dev = "uv run fastapi dev src/noomo_backend/main.py --port 8001 --host 0.0.0.0"
server = "uv run fastapi run src/noomo_backend/main.py --port 8001 --host 0.0.0.0"
docker-build = "docker build -t ghcr.io/skueee/noomo:latest ."

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "uv-script>=0.1.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
